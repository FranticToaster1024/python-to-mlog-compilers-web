name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:



jobs:
  fetch-whl-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Fetch wheels and copy into web folder
      run: |
        while IFS='=' read -r name vcs_url || [ -n "$name" ]; do
          [ -z "$name" ] && continue

          pip wheel --no-deps "$vcs_url" -w dist/
          cp dist/*.whl web/"$name"-0-py3-none-any.whl
          rm -r dist/
        done < "web/compiler_list.txt"


    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'web/'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5